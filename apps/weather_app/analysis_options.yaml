# Weather App — analyzer + lint configuration.
#
# Layer rules (R-9) are enforced by the local `layer_lint` custom_lint plugin
# (tool/layer_lint): presentation may not import data/, domain stays pure Dart,
# and `as` casts are banned in the data layer (DoD#2 / B-6).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/l10n/gen/**
    - tool/layer_lint/**
  language:
    # Fail-closed parsing: implicit downcasts are errors, forcing the explicit
    # asInt/asDouble helpers on all network data.
    strict-casts: true

linter:
  rules:
    - avoid_print
    - prefer_final_locals
    - prefer_const_constructors
    - require_trailing_commas

plugins:
  - custom_lint

custom_lint:
  # riverpod_lint registers itself as a custom_lint plugin via pubspec.
  enable_all_lint_rules: false
