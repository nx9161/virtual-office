name: 🐛 Bug report
description: Report something broken in the office
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see the bug? Numbered steps work well.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
  - type: textarea
    id: context
    attributes:
      label: Environment / context
      description: Branch, commit, relevant config, logs — anything that helps reproduce it.
  - type: textarea
    id: security
    attributes:
      label: Security note
      description: If this bug involves secrets, credentials, or access, say so here — but never paste them into the issue.
